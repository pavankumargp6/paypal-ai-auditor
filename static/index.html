<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PayPal Spend Intelligence Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 40px; background: #f4f7f9; color: #1e293b; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 2rem; color: #0f172a; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #e2e8f0; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab.active { background: #0f172a; color: white; }
        
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card-title { font-size: 0.85rem; text-transform: uppercase; color: #64748b; font-weight: 600; }
        .card-value { font-size: 2rem; font-weight: bold; color: #0f172a; margin-top: 5px; }
        
        .checkout-area { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #0070ba; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #005ea6; }

        .grid-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 400px; }
        .ag-theme-quartz { width: 100%; height: 100%; --ag-foreground-color: #1e293b; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>💳 PayPal Spend Intelligence Agent</h1>
        <div class="badge" id="ai-insight" style="background:#e0f2fe; color:#0369a1; padding:10px 20px; border-radius:20px; font-weight:600;">Loading AI Insights...</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('spend')">Merchant Spend Intelligence</div>
        <div class="tab" onclick="switchTab('subs')">Subscription Auditor (Demo)</div>
    </div>

    <!-- SPEND INTELLIGENCE TAB -->
    <div id="spend-tab">
        <div class="summary-grid">
            <div class="card">
                <div class="card-title">Total Captured Revenue</div>
                <div class="card-value" id="total-revenue">$0.00</div>
            </div>
            <div class="card">
                <div class="card-title">Successful Payments</div>
                <div class="card-value" id="total-success">0</div>
            </div>
            <div class="card">
                <div class="card-title">Failed / Declined</div>
                <div class="card-value" id="total-failed" style="color:#ef4444;">0</div>
            </div>
        </div>

        <div class="checkout-area">
            <div>
                <h3 style="margin:0 0 5px 0;">Test PayPal Sandbox Checkout</h3>
                <p style="margin:0; color:#64748b; font-size:0.9rem;">Create a real $25.00 order and capture it to see the dashboard update.</p>
            </div>
            <button class="btn" id="checkout-btn" onclick="runCheckout()">Run Sandbox Checkout</button>
        </div>

        <div class="grid-container" id="spendGrid" class="ag-theme-quartz"></div>
    </div>

    <!-- SUBSCRIPTION TAB -->
    <div id="subs-tab" class="hidden">
        <div class="grid-container" id="subsGrid" class="ag-theme-quartz"></div>
    </div>

    <script>
        let spendGridApi, subsGridApi;

        // Initialize AG Grids
        document.addEventListener('DOMContentLoaded', () => {
            // Spend Grid
            spendGridApi = agGrid.createGrid(document.querySelector('#spendGrid'), {
                columnDefs: [
                    { field: "id", headerName: "Capture ID", flex: 1 },
                    { field: "amount", headerName: "Amount", flex: 1, valueFormatter: p => '$' + p.value.toFixed(2) },
                    { field: "status", headerName: "Status", flex: 1 },
                    { field: "date", headerName: "Date", flex: 1 }
                ],
                rowData: [
                    { id: "CAP-101", amount: 25.00, status: "COMPLETED", date: "2026-10-01" },
                    { id: "CAP-102", amount: 150.50, status: "COMPLETED", date: "2026-10-05" },
                    { id: "CAP-104", amount: 0.00, status: "DECLINED", date: "2026-10-10" }
                ]
            });

            // Sub Grid
            subsGridApi = agGrid.createGrid(document.querySelector('#subsGrid'), {
                columnDefs: [
                    { field: "merchant", headerName: "Merchant" },
                    { field: "category", headerName: "Category" },
                    { field: "annual_cost", headerName: "Annual Cost", valueFormatter: p => '$' + p.value.toFixed(2) }
                ],
                rowData: []
            });

            // Fetch AI Insight
            fetch('/api/spend-intelligence')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('ai-insight').innerText = "🤖 " + data.ai_insight;
                    document.getElementById('total-revenue').innerText = '$' + data.total_captured.toFixed(2);
                    document.getElementById('total-success').innerText = data.total_count;
                    document.getElementById('total-failed').innerText = data.failed_count;
                });
        });

        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#spend-tab, #subs-tab').forEach(t => t.classList.add('hidden'));
            
            if (tab === 'spend') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('spend-tab').classList.remove('hidden');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('subs-tab').classList.remove('hidden');
                fetch('/api/analyze-subscriptions').then(r => r.json()).then(d => subsGridApi.setGridOption('rowData', d));
            }
        }

        // Real PayPal Checkout Flow
        function runCheckout() {
            const btn = document.getElementById('checkout-btn');
            btn.innerText = "Creating Order...";
            btn.disabled = true;

            fetch('/api/create-order', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    btn.innerText = "Capturing Payment...";
                    
                    // In a real app, you would redirect the user to PayPal here.
                    // For this hackathon demo, we simulate the buyer approving it instantly.
                    return fetch('/api/capture-order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ orderID: data.orderID })
                    });
                })
                .then(res => res.json())
                .then(payment => {
                    if (payment.error) throw new Error(payment.error);
                    alert(`✅ Payment Captured! ID: ${payment.id} for $${payment.amount}`);
                    // Add to table
                    const newRow = { id: payment.id, amount: payment.amount, status: payment.status, date: payment.date };
                    spendGridApi.applyTransaction({ add: [newRow] });
                    btn.innerText = "Run Sandbox Checkout";
                    btn.disabled = false;
                })
                .catch(err => {
                    alert("Checkout Error: " + err.message);
                    btn.innerText = "Run Sandbox Checkout";
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
