<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PayPal Spend Intelligence Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 40px; background: #f4f7f9; color: #1e293b; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 2rem; color: #0f172a; }
        
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card-title { font-size: 0.85rem; text-transform: uppercase; color: #64748b; font-weight: 600; }
        .card-value { font-size: 2rem; font-weight: bold; color: #0f172a; margin-top: 5px; }
        
        .checkout-area { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .grid-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 400px; }
        .ag-theme-quartz { width: 100%; height: 100%; --ag-foreground-color: #1e293b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>💳 PayPal Spend Intelligence Agent</h1>
        <div class="badge" id="ai-insight" style="background:#e0f2fe; color:#0369a1; padding:10px 20px; border-radius:20px; font-weight:600;">Loading AI Insights...</div>
    </div>

    <div class="summary-grid">
        <div class="card">
            <div class="card-title">Total Captured Revenue</div>
            <div class="card-value" id="total-revenue">$0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Successful Payments</div>
            <div class="card-value" id="total-success">0</div>
        </div>
        <div class="card">
            <div class="card-title">Failed / Declined</div>
            <div class="card-value" id="total-failed" style="color:#ef4444;">0</div>
        </div>
    </div>

    <div class="checkout-area">
        <div>
            <h3 style="margin:0 0 5px 0;">Real PayPal Sandbox Checkout</h3>
            <p style="margin:0; color:#64748b; font-size:0.9rem;">Click the button below, log in with a Sandbox Buyer account, and approve the $25.00 payment.</p>
        </div>
        <!-- Official PayPal Button Container -->
        <div id="paypal-button-container"></div>
    </div>

    <div class="grid-container" id="spendGrid" class="ag-theme-quartz"></div>

    <script>
        let spendGridApi;

        // Initialize AG Grid
        document.addEventListener('DOMContentLoaded', () => {
            spendGridApi = agGrid.createGrid(document.querySelector('#spendGrid'), {
                columnDefs: [
                    { field: "id", headerName: "Capture ID", flex: 1 },
                    { field: "amount", headerName: "Amount", flex: 1, valueFormatter: p => '$' + p.value.toFixed(2) },
                    { field: "status", headerName: "Status", flex: 1 },
                    { field: "date", headerName: "Date", flex: 1 }
                ],
                rowData: []
            });

            refreshDashboard();
            loadPayPalSDK();
        });

        // Fetch Stats & Transactions
        function refreshDashboard() {
            fetch('/api/spend-intelligence')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('ai-insight').innerText = "🤖 " + data.ai_insight;
                    document.getElementById('total-revenue').innerText = '$' + data.total_captured.toFixed(2);
                    document.getElementById('total-success').innerText = data.total_count;
                    document.getElementById('total-failed').innerText = data.failed_count;
                });

            fetch('/api/transactions')
                .then(res => res.json())
                .then(data => {
                    spendGridApi.setGridOption('rowData', data);
                });
        }

        // Load PayPal SDK dynamically with Client ID from backend
        async function loadPayPalSDK() {
            const res = await fetch('/api/config');
            const config = await res.json();

            const script = document.createElement('script');
            // FIX: Added &buyer-country=US to resolve HTTP 400 error for international sandbox testing
            script.src = `https://www.paypal.com/sdk/js?client-id=${config.clientId}&currency=USD&buyer-country=US`;
            script.onload = renderPayPalButton;
            document.head.appendChild(script);
        }

        // Render the Official PayPal Button
        function renderPayPalButton() {
            paypal.Buttons({
                // 1. Create Order
                createOrder: async () => {
                    const res = await fetch('/api/create-order', { method: 'POST' });
                    const data = await res.json();
                    if (data.error) { alert(data.error); throw new Error(data.error); }
                    return data.id; 
                },
                // 2. Capture Order (Only runs after user logs in and approves)
                onApprove: async (data) => {
                    try {
                        const res = await fetch('/api/capture-order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ orderID: data.orderID })
                        });
                        
                        let payment;
                        try {
                            payment = await res.json();
                        } catch (e) {
                            throw new Error("Server returned an invalid response.");
                        }

                        if (!res.ok || payment.error) {
                            throw new Error(payment.error || "Unknown capture error");
                        }
                        
                        alert(`✅ Payment Captured! ID: ${payment.id} for $${payment.amount}`);
                        refreshDashboard(); 
                        
                    } catch (err) {
                        console.error(err);
                        alert("Checkout Error: " + err.message);
                    }
                },
                onError: (err) => {
                    console.error(err);
                    alert("PayPal Checkout Error. Check the console.");
                }
            }).render('#paypal-button-container');
        }
    </script>
</body>
</html>
